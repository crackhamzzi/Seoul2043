name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: node ./node_modules/vinext/dist/cli.js build

      - name: Inspect build output
        run: |
          echo "=== HTML files ==="
          find dist/client -type f -name "*.html" -print

          echo "=== _next directories ==="
          find dist -type d -name "_next" -print || true

          echo "=== CSS files ==="
          find dist -type f -name "*.css" -print | head -100 || true

          echo "=== JS chunks ==="
          find dist -type f -name "*.js" -print | head -100 || true

          echo "=== client tree ==="
          find dist/client -maxdepth 5 -type f -print | sort | head -200

      - name: Normalize GitHub Pages assets
        run: |
          if [ -d "dist/client/_next" ]; then
            echo "_next already in correct location"

          elif [ -d "dist/client/Seoul2043/_next" ]; then
            echo "Moving dist/client/Seoul2043/_next -> dist/client/_next"

            mkdir -p dist/client/_next
            cp -a dist/client/Seoul2043/_next/. dist/client/_next/

          else
            echo "ERROR: Could not find generated _next directory"
            find dist -type d -name "_next" -print || true
            exit 1
          fi

      - name: Verify Pages output
        run: |
          echo "=== index.html ==="
          test -f dist/client/index.html

          echo "=== _next/static ==="
          test -d dist/client/_next/static

          echo "=== final asset paths ==="
          grep -oE '(src|href)="[^"]+"' dist/client/index.html | head -50 || true

          echo "=== final _next files ==="
          find dist/client/_next -type f | head -100

      - name: Disable Jekyll
        run: touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4